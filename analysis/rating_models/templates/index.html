<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santorini Head-to-Head Analysis</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Santorini Player Analysis</h1>
        <p>Select a player to see their performance rating against each opponent, anchored to the opponent's true Elo.</p>

        <div class="selector-container">
            <label for="player-select">Select Player:</label>
            <select id="player-select">
                <option value="">-- Please choose a player --</option>
                {% for player in players %}
                    <option value="{{ player }}">{{ player.replace('|', ' - ') }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="loading" class="hidden">Loading...</div>

        <div id="results-container">
            <h2 id="results-header"></h2>
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Opponent</th>
                        <th>Matches Played</th>
                        <th>Win Rate (%)</th>
                        <th>Hypothetical Elo</th> </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
